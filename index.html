<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=0"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="theme-color" content="#07101f"/>
    <title>🏓 Ping Manager</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3252/3252194.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #07101f; --bg2: #0c1929; --bg3: #112035; --bd: #193450;
            --c0: #3b82f6; --c1: #a855f7; --c2: #f59e0b; --c3: #10b981;
            --ok: #22c55e; --bad: #ef4444; --tx: #d4e4f8; --mu: #4a6480;
            --f: 'Barlow Condensed', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg); color: var(--tx); font-family: var(--f); 
            margin: 0; padding: env(safe-area-inset-top) 15px 40px; 
            display: flex; justify-content: center; min-height: 100vh;
        }

        .wrap { width: 100%; max-width: 460px; }

        .hdr { text-align: center; padding: 20px 0; }
        .hdr h1 { font-size: 2.4rem; margin: 0; letter-spacing: 3px; color: #fff; font-weight: 900; }
        .hdr p { color: var(--mu); margin: 5px 0 0; font-size: 0.8rem; letter-spacing: 1px; }

        .card { 
            background: var(--bg2); border: 1px solid var(--bd); 
            border-radius: 16px; padding: 18px; margin-bottom: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--c0); letter-spacing: 1.5px; margin-bottom: 12px; display: block; }

        .prow { display: flex; gap: 10px; margin-bottom: 10px; }
        .pin { 
            flex: 1; background: var(--bg3); border: 1.5px solid var(--bd); 
            border-radius: 10px; color: #fff; padding: 14px; 
            font-family: var(--f); font-size: 16px; transition: 0.2s;
        }
        .pin:focus { border-color: var(--c0); outline: none; }

        .xbtn { 
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--bad); 
            color: var(--bad); border-radius: 10px; width: 48px; 
            cursor: pointer; font-size: 1.2rem; font-weight: bold;
        }

        .btn { 
            width: 100%; padding: 18px; border-radius: 12px; border: none; 
            font-weight: 900; text-transform: uppercase; cursor: pointer; 
            font-family: var(--f); font-size: 1.1rem; letter-spacing: 1px; transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
        .btn-green { background: linear-gradient(135deg, #059669, #047857); color: #fff; margin-top: 10px; }
        .btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; transform: none; }

        .tgrid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 15px 0; }
        .tc { 
            background: var(--bg3); padding: 15px; border-radius: 14px; 
            border: 1px solid var(--bd); border-left: 5px solid var(--c0); 
        }

        .pb { 
            width: 100%; text-align: left; padding: 15px; margin: 8px 0; 
            border-radius: 10px; border: 1.5px solid var(--bd); 
            background: var(--bg2); color: #fff; font-family: var(--f); 
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
        }
        .pb.sel { background: var(--ok); color: #000; border-color: var(--ok); box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }

        .st { width: 100%; border-collapse: collapse; }
        .st th { font-size: 0.65rem; color: var(--mu); text-transform: uppercase; padding-bottom: 10px; }
        .st td { padding: 12px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1rem; }
        .st tr:last-child td { border: none; }

        .addbtn { 
            background: none; border: 1.5px dashed var(--mu); color: var(--mu); 
            padding: 12px; width: 100%; border-radius: 10px; 
            cursor: pointer; font-weight: bold; margin-top: 5px; font-family: var(--f);
        }

        .res-area { text-align: center; margin-top: 20px; }
        .res-btn { background: none; border: none; color: var(--mu); font-size: 0.7rem; letter-spacing: 1.5px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="wrap"><div id="app"></div></div>

<script>
let S = {
    screen: 'setup',
    names: ['Ioan', 'Marcu', 'Cosmin', 'Grindei', 'Sovan'],
    nT: 2,
    players: [],
    round: 0,
    stats: {},
    sel: [],
    err: ''
};

function render() {
    const app = document.getElementById('app');
    if (S.screen === 'setup') {
        app.innerHTML = `
            <div class="hdr"><h1>PING MANAGER</h1><p>TENIS DE MASĂ TEAM</p></div>
            <div class="card">
                <span class="section-title">👥 Jucători înscriși</span>
                <div id="p-list">${S.names.map((n, i) => `
                    <div class="prow">
                        <input class="pin" type="text" placeholder="Nume jucător..." value="${n}" oninput="S.names[${i}] = this.value">
                        <button class="xbtn" onclick="removeName(${i})">✕</button>
                    </div>`).join('')}
                </div>
                <button class="addbtn" onclick="addName()">+ ADAUGĂ ALT JUCĂTOR</button>
            </div>
            ${S.err ? `<div style="color:var(--bad);text-align:center;margin-bottom:10px;font-weight:bold">${S.err}</div>` : ''}
            <button class="btn btn-blue" onclick="start()">LANSEAZĂ TURNEUL</button>
        `;
    } else {
        const pairs = getPairs();
        const stand = Object.entries(S.stats).sort((a,b) => (b[1].w - a[1].w) || (a[1].l - b[1].l));
        app.innerHTML = `
            <div class="hdr"><h1>RUNDA #${S.round + 1}</h1><p>SELECTEAZĂ CÂȘTIGĂTORII</p></div>
            <div class="card">
                <span class="section-title">🏓 Mese de joc</span>
                <div class="tgrid">
                    ${pairs.map((p, ti) => `
                        <div class="tc">
                            <div style="font-size:0.7rem; color:var(--mu); margin-bottom:5px">MASA ${ti+1}</div>
                            <button class="pb ${S.sel[ti] === p[0] ? 'sel' : ''}" onclick="vote(${ti}, '${p[0]}')">${p[0]}</button>
                            <button class="pb ${S.sel[ti] === p[1] ? 'sel' : ''}" onclick="vote(${ti}, '${p[1]}')">${p[1]}</button>
                        </div>`).join('')}
                </div>
                <button class="btn btn-green" ${S.sel.filter(x=>x).length < S.nT ? 'disabled' : ''} onclick="nextRound()">CONFIRMĂ REZULTATE</button>
            </div>
            <div class="card">
                <span class="section-title">🏆 Clasament Live</span>
                <table class="st">
                    <thead><tr><th>#</th><th align="left">Jucător</th><th>V</th><th>Î</th></tr></thead>
                    <tbody>
                    ${stand.map((s, i) => `<tr><td>${i+1}</td><td align="left" style="font-weight:bold">${s[0]}</td><td style="color:var(--ok)">${s[1].w}</td><td style="color:var(--bad)">${s[1].l}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
            <div class="res-area">
                <button class="res-btn" onclick="if(confirm('Resetezi tot?')) location.reload()">↺ Resetare completă</button>
            </div>
        `;
    }
}

function addName() { S.names.push(''); render(); }
function removeName(i) { S.names.splice(i, 1); render(); }

function start() {
    S.players = S.names.filter(n => n.trim() !== '');
    if (S.players.length < S.nT * 2) {
        S.err = `Ai nevoie de minim ${S.nT * 2} jucători!`;
        render();
        return;
    }
    S.err = '';
    S.players.forEach(p => S.stats[p] = { w: 0, l: 0 });
    S.screen = 'game';
    S.round = 0;
    S.sel = Array(S.nT).fill(null);
    render();
}

function getPairs() {
    const sorted = [...S.players].sort((a,b) => S.stats[a].w - S.stats[b].w);
    const p = [];
    for(let i=0; i<S.nT; i++) p.push([sorted[i*2], sorted[i*2+1]]);
    return p;
}

function vote(ti, name) { S.sel[ti] = name; render(); }

function nextRound() {
    const pairs = getPairs();
    pairs.forEach((p, ti) => {
        const win = S.sel[ti];
        const los = p.find(n => n !== win);
        S.stats[win].w++;
        S.stats[los].l++;
    });
    S.round++;
    S.sel = Array(S.nT).fill(null);
    render();
}

// Înregistrare Service Worker pentru PWA
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
